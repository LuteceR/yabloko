<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>game</title>
        <link rel="stylesheet" href="src/task2/styles.css">
    </head>
    <body>

    <!-- Модальное окно -->
    <div
        class="modal-overlay"
        id="settingsModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >
        <div class="modal">
            <h2 id="modalTitle">Настройка системы координат</h2>

            <div class="field">
                <label for="coordinateDirection">
                    Направление системы координат
                </label>

                <select id="coordinateDirection">
                    <option value="">Выберите направление</option>
                    <option value="left">Левая</option>
                    <option value="right">Правая</option>
                </select>
            </div>

            <div class="field">
                <label for="calculationMethod">
                    Способ расчёта
                </label>

                <select id="calculationMethod">
                    <option value="">Выберите способ</option>
                    <option value="manual">Ручной</option>
                    <option value="automatic">Автоматический</option>
                </select>
            </div>

            <button
                class="continue-button"
                id="continueButton"
                type="button"
                disabled
            >
                Далее
            </button>
        </div>
    </div>

    <main class="page-content">
        <div id="container"></div>
    </main>
        <script type="module" src="/src/task2/main.js"></script>
    </body>
    </html>
